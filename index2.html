<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>PhotoFlow QR - กำลังเปิดอัลบั้ม</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:20px;font-family:Tahoma,"Noto Sans Thai",sans-serif;color:#102a2a;background:radial-gradient(circle at 10% 10%,#ccfbf1 0,transparent 36%),radial-gradient(circle at 95% 90%,#dbeafe 0,transparent 40%),#f8fafc}.card{width:min(520px,100%);padding:34px 25px;text-align:center;border:1px solid rgba(15,118,110,.12);border-radius:28px;background:rgba(255,255,255,.96);box-shadow:0 22px 60px rgba(15,118,110,.15)}.logo{width:84px;height:84px;display:grid;place-items:center;margin:0 auto 18px;border-radius:25px;color:#fff;background:linear-gradient(135deg,#0f766e,#14b8a6);font-size:38px;box-shadow:0 14px 30px rgba(15,118,110,.25)}h1{margin:0 0 8px;font-size:1.55rem}p{margin:0;color:#64748b;line-height:1.65}.spinner{width:44px;height:44px;margin:23px auto;border:4px solid #ccfbf1;border-top-color:#0f766e;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.btn{display:none;min-height:48px;align-items:center;justify-content:center;margin-top:20px;padding:10px 18px;border:0;border-radius:14px;color:#fff;background:#0f766e;font-weight:700;text-decoration:none}.error{display:none;margin-top:18px;padding:13px;border-radius:14px;color:#9f1239;background:#fff1f2}.footer{margin-top:20px;color:#94a3b8;font-size:.8rem}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">📷</div>
    <h1>PhotoFlow QR</h1>
    <p id="message">กำลังเปิดอัลบั้มที่เลือก กรุณารอสักครู่…</p>
    <div id="spinner" class="spinner"></div>
    <div id="error" class="error">ลิงก์อัลบั้มไม่ถูกต้อง กรุณาสแกน QR Code จากผู้ดูแลอีกครั้ง</div>
    <a id="openButton" class="btn" href="#">เปิดอัลบั้ม</a>
    <div class="footer">PhotoFlow QR • Direct Album Bridge</div>
  </main>
  <script>
    'use strict';
    (function(){
      const params=new URLSearchParams(window.location.search),raw=params.get('open'),button=document.getElementById('openButton');
      try{
        if(!raw)throw new Error('missing target');
        const target=new URL(raw),validHost=target.hostname==='script.google.com'||target.hostname.endsWith('.googleusercontent.com'),validPath=target.pathname.indexOf('/macros/s/')===0;
        if(target.protocol!=='https:'||!validHost||!validPath)throw new Error('invalid target');
        button.href=target.href;button.style.display='inline-flex';
        window.setTimeout(function(){window.location.replace(target.href)},350);
      }catch(error){
        document.getElementById('spinner').style.display='none';document.getElementById('message').textContent='ไม่สามารถเปิดอัลบั้มได้';document.getElementById('error').style.display='block';button.style.display='none';
      }
    })();
  </script>
</body>
</html>
