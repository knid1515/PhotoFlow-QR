<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>PhotoFlow QR Camera</title>
  <style>
    :root{--primary:#0f766e;--primary2:#14b8a6;--ink:#102a2a;--muted:#64748b;--bg:#f0fdfa;--card:#fff;--line:#d8eeeb;--danger:#be123c}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Tahoma,"Noto Sans Thai",sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 8%,#ccfbf1 0,transparent 35%),radial-gradient(circle at 95% 95%,#dbeafe 0,transparent 38%),#f8fafc}
    button,input{font:inherit}.shell{width:min(760px,100%);margin:auto;padding:22px 14px 40px}.brand{display:flex;align-items:center;gap:13px;margin-bottom:18px}.logo{width:54px;height:54px;display:grid;place-items:center;border-radius:18px;color:#fff;background:linear-gradient(135deg,var(--primary),#38bdf8);font-size:25px;box-shadow:0 10px 25px rgba(15,118,110,.22)}.brand h1{font-size:1.3rem;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:.86rem}
    .card{padding:18px;border:1px solid rgba(15,118,110,.1);border-radius:24px;background:rgba(255,255,255,.95);box-shadow:0 18px 50px rgba(15,118,110,.12)}.reader-wrap{height:min(62vh,520px);min-height:340px;position:relative;overflow:hidden;border-radius:20px;background:#032f2d}.reader{width:100%;height:100%}.reader video{width:100%!important;height:100%!important;object-fit:cover!important}.placeholder{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:10px;color:#a7d8d3;pointer-events:none}.placeholder .qr{font-size:62px}.reader-wrap.active .placeholder{display:none}.frame{display:none;pointer-events:none;position:absolute;z-index:3;inset:19% 18%;border:3px solid #5eead4;border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.34)}.reader-wrap.active .frame{display:block}.frame:after{content:"";position:absolute;left:6%;right:6%;top:10%;height:2px;background:#fff;box-shadow:0 0 14px #5eead4;animation:scan 2s linear infinite}@keyframes scan{50%{top:88%}}
    .status{display:flex;align-items:flex-start;gap:9px;margin:13px 0;padding:11px 13px;border-radius:14px;color:#0f5f59;background:#ecfdf5;font-size:.9rem}.status.error{color:#9f1239;background:#fff1f2}.status.success{color:#166534;background:#f0fdf4}.actions{display:grid;grid-template-columns:1fr auto;gap:9px}.btn{min-height:48px;border:0;border-radius:14px;padding:10px 16px;font-weight:700;cursor:pointer}.btn-primary{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 9px 20px rgba(15,118,110,.22)}.btn-light{color:var(--primary);border:1px solid var(--line);background:#fff}.btn:disabled{opacity:.6;cursor:not-allowed}.upload{display:flex;align-items:center;justify-content:center;margin-top:9px}.upload input{display:none}
    .result{display:none;margin-top:14px;padding:15px;border-radius:17px;background:#f0fdf4;border:1px solid #bbf7d0}.result.show{display:block}.result strong{display:block;color:#166534}.result code{display:block;margin:8px 0;padding:10px;border-radius:10px;background:#fff;overflow-wrap:anywhere}.result-actions{display:flex;flex-wrap:wrap;gap:8px}.result-actions a{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:17px}
    #fileReader{position:fixed;left:-9999px;top:0;width:360px;height:360px;overflow:hidden}
    @media(max-width:520px){.shell{padding:12px 10px 28px}.card{padding:11px;border-radius:19px}.reader-wrap{height:58vh;min-height:330px}.actions{grid-template-columns:1fr}.actions .btn{width:100%}.brand{padding:4px}.brand h1{font-size:1.12rem}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div class="logo">📷</div>
      <div><h1>PhotoFlow QR Camera</h1><p>หน้าสแกนกล้องภายนอก Google Apps Script</p></div>
    </header>

    <section class="card">
      <div id="readerWrap" class="reader-wrap">
        <div id="reader" class="reader"></div>
        <div class="placeholder"><div class="qr">▦</div><span>กำลังเตรียมกล้อง…</span></div>
        <div class="frame"></div>
      </div>

      <div id="status" class="status">ℹ️ <span>เมื่อเบราว์เซอร์ถามสิทธิ์กล้อง ให้เลือก “อนุญาต”</span></div>

      <div class="actions">
        <button id="startBtn" class="btn btn-primary" type="button">📷 เปิดกล้องหลัง</button>
        <button id="stopBtn" class="btn btn-light" type="button">■ ปิดกล้อง</button>
      </div>

      <label class="btn btn-light upload" for="qrFile">⬆️ อัปโหลดรูป QR Code</label>
      <input id="qrFile" type="file" accept="image/*">
      <div id="fileReader" aria-hidden="true"></div>

      <div id="result" class="result">
        <strong>อ่าน QR Code สำเร็จ</strong>
        <code id="resultText"></code>
        <div class="result-actions">
          <a id="openResultBtn" class="btn btn-primary" href="#">เปิดลิงก์</a>
          <button id="copyBtn" class="btn btn-light" type="button">คัดลอก</button>
        </div>
      </div>
    </section>
    <div class="footer">PhotoFlow QR • External Camera Scanner</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    'use strict';
    const APP={scanner:null,fileScanner:null,running:false,handled:false,decoded:''};
    const byId=id=>document.getElementById(id);

    document.addEventListener('DOMContentLoaded',()=>{
      byId('startBtn').addEventListener('click',startCamera);
      byId('stopBtn').addEventListener('click',stopCamera);
      byId('qrFile').addEventListener('change',scanFile);
      byId('copyBtn').addEventListener('click',copyResult);
      startCamera();
    });

    function setStatus(message,type='info'){
      const box=byId('status');box.className='status'+(type==='error'?' error':type==='success'?' success':'');
      box.innerHTML=(type==='error'?'⚠️ ':type==='success'?'✅ ':'ℹ️ ')+'<span>'+escapeHtml(message)+'</span>';
    }

    function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
    function scannerConfig(){return{fps:12,qrbox:(width,height)=>{const size=Math.floor(Math.min(width,height)*.68);return{width:size,height:size}},aspectRatio:1.3333333,disableFlip:false}}

    async function cameraCandidates(){
      const cameras=await Html5Qrcode.getCameras();
      const rearPattern=/back|rear|environment|world|กล้องหลัง|หลัง|traseira|trasera|arriere|rueck|hinten|후면|背面/i;
      const rear=cameras.filter(camera=>rearPattern.test(camera.label||''));
      const values=[...rear.map(camera=>camera.id),{facingMode:{exact:'environment'}},{facingMode:'environment'},...cameras.map(camera=>camera.id)];
      const seen=new Set();return values.filter(value=>{const key=typeof value==='string'?'id:'+value:JSON.stringify(value);if(seen.has(key))return false;seen.add(key);return true});
    }

    async function startCamera(){
      if(!window.isSecureContext)return setStatus('ต้องเปิด camera.html ผ่าน HTTPS เท่านั้น','error');
      if(typeof Html5Qrcode==='undefined')return setStatus('โหลดตัวอ่าน QR ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต','error');
      const button=byId('startBtn');button.disabled=true;button.textContent='กำลังขอสิทธิ์กล้อง…';APP.handled=false;
      try{
        await stopCamera();
        const candidates=await cameraCandidates();let lastError=new Error('ไม่พบกล้อง');
        for(const candidate of candidates){
          const scanner=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],verbose:false});
          try{await scanner.start(candidate,scannerConfig(),handleDecoded,()=>{});APP.scanner=scanner;APP.running=true;break}catch(error){lastError=error;try{scanner.clear()}catch(ignore){}}
        }
        if(!APP.running)throw lastError;
        byId('readerWrap').classList.add('active');setStatus('กล้องพร้อมแล้ว หันกล้องไปยัง QR Code','success');button.textContent='📷 กล้องกำลังทำงาน';
      }catch(error){
        const message=String(error&&error.message?error.message:error);
        if(/NotAllowed|Permission|denied|SecurityError/i.test(message))setStatus('ยังไม่ได้อนุญาตกล้อง กรุณากดไอคอนตั้งค่าเว็บไซต์ด้านซ้ายของแถบที่อยู่ แล้วอนุญาตกล้อง จากนั้นโหลดหน้าใหม่','error');
        else setStatus('เปิดกล้องไม่สำเร็จ: '+message,'error');
        button.textContent='📷 ลองเปิดกล้องอีกครั้ง';
      }finally{button.disabled=false}
    }

    async function stopCamera(){
      const scanner=APP.scanner;APP.scanner=null;
      try{if(scanner&&APP.running)await scanner.stop()}catch(ignore){}
      try{if(scanner)scanner.clear()}catch(ignore){}
      APP.running=false;byId('readerWrap').classList.remove('active');
    }

    async function scanFile(event){
      const input=event.target,file=input.files&&input.files[0];if(!file)return;
      try{
        await stopCamera();
        if(APP.fileScanner){try{APP.fileScanner.clear()}catch(ignore){}}
        APP.fileScanner=new Html5Qrcode('fileReader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],verbose:false});
        setStatus('กำลังอ่าน QR Code จากรูปภาพ…');
        const decoded=await APP.fileScanner.scanFile(file,false);handleDecoded(decoded);
      }catch(error){setStatus('ไม่พบ QR Code ในรูปภาพ กรุณาเลือกรูปที่เห็น QR ชัดเจน','error')}
      finally{input.value='';if(APP.fileScanner){try{APP.fileScanner.clear()}catch(ignore){}}APP.fileScanner=null}
    }

    async function handleDecoded(text){
      if(APP.handled)return;APP.handled=true;APP.decoded=String(text||'').trim();await stopCamera();
      byId('resultText').textContent=APP.decoded;byId('result').classList.add('show');setStatus('อ่าน QR Code สำเร็จ กำลังเปิดลิงก์อัลบั้ม…','success');
      try{
        const url=new URL(APP.decoded);if(!/^https?:$/.test(url.protocol))throw new Error();
        byId('openResultBtn').href=url.href;
        setTimeout(()=>window.location.assign(url.href),900);
      }catch(ignore){byId('openResultBtn').style.display='none';setStatus('อ่าน QR สำเร็จ แต่ข้อมูลไม่ใช่ลิงก์เว็บไซต์','success')}
    }

    async function copyResult(){
      try{await navigator.clipboard.writeText(APP.decoded);setStatus('คัดลอกข้อมูล QR แล้ว','success')}
      catch(ignore){setStatus('ไม่สามารถคัดลอกอัตโนมัติได้','error')}
    }
  </script>
</body>
</html>
